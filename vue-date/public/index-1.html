<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Vue2 + ECharts 饼图示例</title>
  <!-- 引入 Vue 2 -->
  <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
  <!-- 引入 ECharts -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <style>
    #app {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .chart-container {
      width: 600px;
      height: 400px;
      margin-top: 20px;
      border: 1px solid #eee;
      border-radius: 4px;
    }
    button {
      padding: 10px 15px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>
  <div id="app">
    <button @click="showPieChart">显示饼图</button>
    
    <div class="chart-container" v-show="showChart">
      <!-- ECharts 容器 -->
      <div ref="pieChart" style="width: 100%; height: 100%;"></div>
    </div>
  </div>

  <script>
    new Vue({
      el: '#app',
      data: {
        showChart: false,
        chartInstance: null
      },
      methods: {
        showPieChart() {
          this.showChart = true;
          
          // 使用 $nextTick 确保 DOM 更新完成
          this.$nextTick(() => {
            this.initChart();
          });
        },
        
        initChart() {
          // 销毁现有实例（如果存在）
          if (this.chartInstance) {
            this.chartInstance.dispose();
          }
          
          // 初始化 ECharts 实例
          this.chartInstance = echarts.init(this.$refs.pieChart);
          
          // 配置饼图选项
          const option = {
            title: {
              text: '销售统计',
              subtext: '2023年第一季度',
              left: 'center'
            },
            tooltip: {
              trigger: 'item',
              formatter: '{a} <br/>{b}: {c} ({d}%)'
            },
            legend: {
              orient: 'vertical',
              left: 10,
              data: ['电子产品', '服装', '食品', '家居', '图书']
            },
            series: [{
              name: '销售额',
              type: 'pie',
              radius: '50%',
              center: ['50%', '50%'],
              data: [
                { value: 335, name: '电子产品' },
                { value: 310, name: '服装' },
                { value: 234, name: '食品' },
                { value: 135, name: '家居' },
                { value: 1548, name: '图书' }
              ],
              emphasis: {
                itemStyle: {
                  shadowBlur: 10,
                  shadowOffsetX: 0,
                  shadowColor: 'rgba(0, 0, 0, 0.5)'
                }
              },
              label: {
                fontSize: 14
              }
            }]
          };
          
          // 设置图表选项并渲染
          this.chartInstance.setOption(option);
          
          // 窗口大小变化时自动调整图表
          window.addEventListener('resize', () => {
            this.chartInstance.resize();
          });
        }
      },
      
      beforeDestroy() {
        // 组件销毁前移除事件监听器
        window.removeEventListener('resize', this.chartInstance.resize);
        
        // 销毁图表实例
        if (this.chartInstance) {
          this.chartInstance.dispose();
        }
      }
    });
  </script>
</body>
</html>
